# CTF mode — routing eval cases (SPEC §6).
#
# 10 labeled cases. Each case is graded against:
#   expected[0]  = first choice; hit counts toward first-choice accuracy (gate >= 0.8)
#   expected[]   = acceptable ranked candidates (>=2 only for the ambiguous case)
#   forbidden[]  = truly wrong routes; any hit fails the forbidden gate (must be 0)
#
# Skill names must be one of the 12 model-invocable entries:
#   ctf-triage ctf-web ctf-pwn ctf-reverse ctf-crypto ctf-forensics
#   ctf-misc ctf-ai-ml ctf-malware ctf-osint ctf-blackboard ctf-submit
#
# Cases are grounded in kernel/EVAL_CASES.md and templates/ROUTER_TABLE.md:
# route by observable target surface (remote service, attachment type, symptom).

- id: route-001
  prompt: "题目给了一个 Flask 站点源码包（app.py + templates/），远程 8081 端口能访问登录页；login 把用户名直接拼进 SQL，且 /admin 只校验 cookie 里的 role 字段。"
  expected: [ctf-web]
  forbidden: [ctf-pwn, ctf-forensics]

- id: route-002
  prompt: "附件是 64 位 Linux ELF chall（checksec: NX 开、Canary 关、PIE 关），另给 nc 10.10.4.2 31337；程序用 read 读 0x200 字节到 0x40 的栈缓冲区。"
  expected: [ctf-pwn]
  forbidden: [ctf-web, ctf-osint]

- id: route-003
  prompt: "附件 license_check 是 63KB 的 x86-64 ELF，无远程服务；运行后提示输入序列号，错误时打印 invalid key。要求找回能通过校验的字符串。"
  expected: [ctf-reverse]
  forbidden: [ctf-web, ctf-osint]

- id: route-004
  prompt: "题面给出 n、e=3、c 三个十进制大整数（params.json），没有服务器；提示 m^e < n。要求恢复明文 flag。"
  expected: [ctf-crypto]
  forbidden: [ctf-forensics, ctf-web]

- id: route-005
  prompt: "附件是两个 7z 压缩的 RAID5 磁盘镜像 disk.img0.7z / disk.img1.7z，要求从镜像里恢复被删除的 flag 文件。"
  expected: [ctf-forensics]
  forbidden: [ctf-crypto, ctf-pwn]

- id: route-006
  prompt: "远程服务 nc 10.10.4.2 9001 连上是一个 Python 3 交互 REPL，会拦截 import、open、eval 等关键字，要求读出 /flag。"
  expected: [ctf-misc]
  forbidden: [ctf-web, ctf-forensics]

- id: route-007
  prompt: "附件是 model.safetensors 权重、tokenizer 配置和一个 playground.py；题面要求在 system prompt 里注入指令，让本地模型输出隐藏的 secret。"
  expected: [ctf-ai-ml]
  forbidden: [ctf-reverse, ctf-pwn]

- id: route-008
  prompt: "附件 sample.bin 是 Windows PE（.exe）；题面要求不运行样本，从样本里提取 C2 域名与加密配置，并给出 YARA 规则。"
  expected: [ctf-malware]
  forbidden: [ctf-web, ctf-pwn]

- id: route-009
  prompt: "题面只给一条微博截图和一句话『这张照片摄于某年秋天的大学校园』，要求定位照片中的建筑，并找出照片里人物的公开社交账号。"
  expected: [ctf-osint]
  forbidden: [ctf-pwn, ctf-crypto]

# Ambiguous case: two ranked candidates are allowed. First choice is forensics
# (the attached PCAP is the primary surface: restore the traffic first), web is
# an acceptable second choice (the restored payload is a Java-deserialization
# exploit surface). pwn/crypto are truly wrong.
- id: route-010
  prompt: "附件 capture.pcap 里有一段 HTTP 流量：Cookie 是 base64，POST body 是 Java 序列化的十六进制串；既像取证还原，又像 web 反序列化利用；要求先还原链路再判断是否需要打服务。"
  expected: [ctf-forensics, ctf-web]
  forbidden: [ctf-pwn, ctf-crypto]
