# DSH CTF mode — runtime configuration (single source of truth)
#
# This file is read by the ctf-mode tooling. Paths are relative to this file's
# directory unless absolute. Host facts (measured 2026-11-25):
#   - skill discovery scans only `<root>/<name>/SKILL.md` one level deep
#   - `disable-model-invocation: true` skills cannot be auto-loaded by the model
#   - >100 skills in one scanned root makes discovery time out
# So: only the 12 entry skills live under roots/resident/; the 500+ deep packs
# live under pools/ and are reached through `skillctl ctf search/show`.
version: 1
mode: ctf
root: "."

catalog:
  max_resident: 12          # model-visible entries; deep packs never enter catalog
  description_max: 200      # chars; enforced by tools/lint_skills.py

budgets:
  per_challenge: {tokens: 150000, minutes: 45}
  phase_pct: {intake: 10, triage: 5, route: 5, execute: 60, verify: 10, submit: 5, record: 5}
  compaction: {threshold_chars: 8192, head_chars: 4096, tail_chars: 1024}
  subagent_result_tokens: 1000

state:
  backend: blackboard       # blackboard.py CLI from multi-agentcollaboration-blackboard
  db: "runs/<game>/<chal>/board.db"
  fact_statuses: [candidate, verified, challenged, retired]
  verified_writer: checker         # canonical actor prefix: checker-* (legacy verifier-* accepted)

knowledge:
  index: index.json         # generated by `skillctl ctf index`
  pools: pools              # read-only knowledge pools (repo junctions)
  search_cmd: "python ~/.agents/tools/skillctl.py ctf search"
  show_cmd: "python ~/.agents/tools/skillctl.py ctf show"

verification:
  levels: [syntax, local_repro, platform]
  governor: {review_after: 3, user_approval_after: 3, max_attempts: 10}
  reverify: true
  platforms:
    gzctf:
      cli: gzctf            # global command; config at ~/.gzctf/config.json
      credentials: "~/.gzctf/session.json"
      poll_seconds: 12
      http_200_is_not_accepted: true
    ctfy:
      base_url: "https://ctfy.tsinghua.edu.cn"
      api: "/api/v1"
      adapter: bin/ctfy.py
      bootstrap: tools/ctfy_bootstrap.py     # guided login (once) + automated pf_ API token
      token: "~/.ctfy/api_token.txt"         # official agent API token (Settings -> API tokens)
      session: "~/.ctfy/session.json"        # browser teamKey fallback from the guided login
      docs_snapshot: "~/.ctfy/docs_docs_standards_CTFY-0002.txt"   # optional docs snapshot
      competition_id: "<your-ctfy-competition-id>"   # e.g. Platform Playground
      poll_seconds: 3
      http_200_is_not_accepted: true
      note: "practice playground only; live competition use requires explicit user go-ahead"

    datacon:
      base_url: "https://www.datacon.org.cn"
      adapter: bin/datacon.py
      session: "~/.datacon/session.json"        # exported once by tools/datacon_login.py
      rating_note: "single-flight requests + 0.5-1s interval + exponential backoff on 5xx"

telemetry:
  events_file: "traces/events.jsonl"
  events: [route, skill_load, search, tool_call, fact, deadend, verify, submit, compaction]

governance:
  scope_allowlist: []       # empty = challenge-provided targets only, no scanning outside
  web_search: false
  never_write_credentials: true
  blackboard_is_untrusted: true

eval:
  cases: eval/cases
  reports: eval/reports
  baselines: [C0, C1, C2, C3]
